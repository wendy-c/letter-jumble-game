<!doctype html>
<!-- The Rainbow Academy logo with its name: drawn by scripts/make-logo.sh. Add ?beta to the URL
     for the version with a "beta" tag. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500..700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .lockup { display: flex; align-items: center; gap: 14px; width: 270px; height: 96px; padding: 0 6px; box-sizing: border-box;
    font-family: "Fredoka", sans-serif; color: #3d2b63; }
  /* The illustration in a round frame: a white ring inside a thin gold one. */
  .badge { position: relative; flex: none; width: 80px; height: 80px; border-radius: 50%; overflow: hidden;
    background: #fff8ec; box-shadow: 0 0 0 3px #fff, 0 0 0 5px #f7c948, 0 5px 12px rgb(61 43 99 / 18%); }
  .badge img { position: absolute; left: -5%; top: -5%; width: 110%; height: 110%; }
  .name { display: flex; flex-direction: column; }
  .line { font-size: 25px; font-weight: 650; line-height: 1.04; letter-spacing: -0.4px; white-space: nowrap; }
  .rainbow { background: linear-gradient(90deg, #f06aa8 0%, #f59b4c 38%, #8a6ae6 78%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .row { display: flex; align-items: center; gap: 7px; }
  .beta { display: none; border: 1.5px solid #8a6ae6; border-radius: 6px; padding: 1px 5px 1.5px; color: #8a6ae6;
    font-size: 10px; font-weight: 650; letter-spacing: 1.4px; line-height: 1.2; }
  body.with-beta .beta { display: inline-block; }
  .tagline { margin-top: 6px; color: #a59cbd; font-size: 9px; font-weight: 600; letter-spacing: 2.2px; white-space: nowrap; }
</style>
</head>
<body>
  <div class="lockup">
    <div class="badge"><img src="../../public/images/logo.png" alt=""></div>
    <div class="name">
      <span class="line">The <span class="rainbow">Rainbow</span></span>
      <span class="row"><span class="line">Academy</span><span class="beta">BETA</span></span>
      <span class="tagline">LEARN · PLAY · SHINE</span>
    </div>
  </div>
  <script>if (location.search.includes("beta")) document.body.classList.add("with-beta");</script>
</body>
</html>
